kind = "web"
previewPath = "/"
title = "Industry Research Pod"
version = "1.0.0"
id = "artifacts/research-pod"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 3000

[services.development]
run = "pnpm --filter @workspace/research-pod run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/research-pod", "run", "build" ]
publicDir = "artifacts/research-pod/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "3000"
BASE_PATH = "/"
